[package]
name = "darkroom-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic"] }
aes-gcm = "0.10"
light-poseidon = "0.3"
ark-bn254 = "0.5"
ark-ff = "0.5"
num-bigint = "0.4"
hkdf = "0.12"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
