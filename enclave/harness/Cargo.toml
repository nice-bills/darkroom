[package]
name = "harness"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
darkroom-core = { path = "../core" }
wasmtime = "28"
wasmtime-wasi = "28"
wasmtime-wasi-http = "28"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1.0"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
